<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
<title id="title">ThymeCapsule — financial research banner</title>
<desc id="desc">A neoclassical observatory, a golden tree and bull, and a blue celestial globe with financial data motifs.</desc>
<defs>
